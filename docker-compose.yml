# Только PostgreSQL для локальной разработки: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memomaster
      POSTGRES_PASSWORD: memomaster
      POSTGRES_DB: memomaster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
